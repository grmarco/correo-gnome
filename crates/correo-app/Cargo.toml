[package]
name = "correo-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_6"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
correo-core.workspace = true
correo-store = { path = "../correo-store" }
correo-imap = { path = "../correo-imap" }
correo-smtp = { path = "../correo-smtp" }
correo-auth = { path = "../correo-auth", features = ["libsecret"] }
correo-contacts = { path = "../correo-contacts" }
correo-threads = { path = "../correo-threads" }
correo-sync = { path = "../correo-sync" }
tokio.workspace = true
gio = { version = "0.22", features = ["v2_70"] }
serde.workspace = true
async-trait.workspace = true
serde_json = "1"
toml = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
ammonia = "4.2.4"
